<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Practice</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <h1>DOM Practice</h1>

    <section class="area-of-rect">
        <h3>Area of Rectangle</h3>
        <form id="rectangleSubmit">
            <input type="text" placeholder="Enter length" id="rect-length">
            <input type="text" placeholder="Enter width" id="rect-width">
            <button>Calculate Area</button>
        </form>

        <h4><span class="rect-result"></span></h4>

    </section>

    <!-- form validation practice -->
    <section class="form-validation">
        <h3>Form Validation</h3>
        <form id="validationSubmit">
            What's your age?
            <input type="number" placeholder="Enter age" id="age">


            <div class="show-form hide">
                <input type="text" placeholder="Enter username" id="username">
                <br>
                <input type="email" placeholder="Enter email" id="email">
                <br>
                <input type="password" placeholder="Enter password" id="password">
                <span class="show-password">show</span>
                <br>
                <button>Submit</button>
            </div>

            <div class="not-eligible hide">
                <h4>Sorry, you are not eligible to submit the form.</h4>
            </div>
        </form>

        <h4><span class="validation-result"></span></h4>
    </section>
    
</body>
</html>
